<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HyperNexa Studio Test</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: white;
      font-family: Arial, sans-serif;
    }
    .box {
      padding: 40px;
      border: 1px solid #22d3ee;
      border-radius: 24px;
      background: #0f172a;
      text-align: center;
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
    }
    h1 {
      color: #22d3ee;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>HyperNexa Studio is live ✅</h1>
    <p>GitHub Pages and custom domain are working.</p>
  </div>
</body>
</html>
